{% extends "base.html" %}
{% block title %}Log in · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="auth card">
  <h1 class="h big">Welcome back!</h1>
  <p class="meta">{{ TAGLINE }}</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit">Log in</button></div>
  </form>
  <p>New here? <a href="{{ url_for('signup') }}">Join {{ APP_NAME }}</a></p>
</div>
{% endblock %}
