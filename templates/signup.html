{% extends "base.html" %}
{% block title %}Join · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="auth card">
  <h1 class="h big">Join {{ APP_NAME }}</h1>
  <p class="meta">Make your Yearbook entry. Others can see it.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" value="{{ form.get('username', '') }}" autocomplete="username" required>
    <label for="password">Password (at least 6 characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" value="{{ form.get('name', '') }}" required>
    <label for="programme">Programme</label>
    <input id="programme" name="programme" type="text" value="{{ form.get('programme', '') }}" placeholder="e.g. CSE (AI)">
    <label for="year">Year</label>
    <select id="year" name="year">
      {% for y in [1, 2, 3, 4] %}<option value="{{ y }}" {{ 'selected' if form.get('year', '1') == y|string }}>Year {{ y }}</option>{% endfor %}
    </select>
    <label for="bio">Short bio</label>
    <textarea id="bio" name="bio" rows="3">{{ form.get('bio', '') }}</textarea>
    <label for="skills">Skills (separate with commas)</label>
    <input id="skills" name="skills" type="text" value="{{ form.get('skills', '') }}" placeholder="Python, UI/UX, DSA">
    <fieldset class="avatars">
      <legend>Pick your avatar</legend>
      {% for a in avatars %}
      <label class="avpick"><input type="radio" name="avatar" value="{{ a }}" {{ 'checked' if (form.get('avatar', avatars[0]) == a) }}><span>{{ a }}</span></label>
      {% endfor %}
    </fieldset>
    <div class="actions"><button class="btn" type="submit">Create my account</button></div>
  </form>
  <p>Already a pal? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
